services:
  processlab:
    build:
      context: .
      dockerfile: Dockerfile
    image: processlab:local
    init: true
    command: ["serve", "--addr", "0.0.0.0:8080", "--db", "/data/processlab.db"]
    ports:
      - "${PROCESSLAB_PORT:-8080}:8080"
    volumes:
      - processlab-data:/data
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  processlab-data:

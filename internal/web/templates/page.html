{{define "page"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Process Lab · HTMX control studio</title>
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
  <!-- menu.js defines window.ProcessLab.menu, which app.js registers against. -->
  <script src="/assets/menu.js" defer></script>
  <script src="/assets/app.js" defer></script>
  <!-- tabs.js after app.js: it registers a second menu region and claims
       Ctrl/Cmd + Shift + arrows, both of which read as additions to the
       canvas layer rather than replacements for it. -->
  <script src="/assets/tabs.js" defer></script>
</head>
<body>
  {{template "workbench" .Workbench}}
</body>
</html>
{{end}}

{{define "page"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="htmx-config" content='{"defaultSettleDelay":0}'>
  <title>{{.Workbench.Title}}</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/htmx-2.0.10.min.js"></script>
  <!-- menu.js defines window.ProcessLab.menu, which the canvas modules
       register against. -->
  <script src="/assets/menu.js" defer></script>
  <!-- No defer on the module: type="module" is deferred by definition, and
       deferred classic scripts and module scripts share one execution list
       ordered by document position. The three below therefore still run in
       the order they are written, which is the order they depend on. -->
  <script type="module" src="/assets/js/main.js"></script>
  <!-- tabs.js after the canvas modules: it registers a second menu region
       and claims Ctrl/Cmd + Shift + arrows, both of which read as additions
       to the canvas layer rather than replacements for it. -->
  <script src="/assets/tabs.js" defer></script>
</head>
<body>
  <!-- The register at / is a working page without JavaScript: its links are
       real links and its new-project form is a real POST. The workbench is
       not, and cannot honestly be made so — placing and wiring blocks on a
       canvas has no HTML equivalent, and the property form is a PUT, which a
       form element cannot express. Every mutation route here is a fragment
       endpoint by design. Say that plainly instead of shipping forms that
       silently do nothing. -->
  <noscript>
    <p class="noscript-notice">
      The workbench needs JavaScript to place, wire, and edit blocks.
      <a href="/">The project register</a> works without it.
    </p>
  </noscript>
  {{template "workbench" .Workbench}}
</body>
</html>
{{end}}
